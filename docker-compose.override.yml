services:
  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    ports: ["5173:5173"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules

  api_backend:
    build:
      context: ./backend
      target: development
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 10
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/.importlinter:/app/.importlinter
      - ./backend/scripts:/app/scripts
      - ./backend/pyproject.toml:/app/pyproject.toml

  celery_worker:
    build:
      context: ./backend
      target: development
    command: watchfiles --filter python "celery -A core.celery_app worker --loglevel=info -Q optimization_queue" /app/src
    volumes: ["./backend/src:/app/src"]

  redis_broker:
    ports: ["6379:6379"]
